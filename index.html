<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f3a">
  <title>最新公告</title>
  <style>
    :root {
      --navy: #091b35;
      --navy-2: #102c4f;
      --ink: #132238;
      --muted: #6c7b8e;
      --gold: #c6a15b;
      --gold-light: #ead6a4;
      --white: #fff;
      --line: rgb(255 255 255 / 18%);
      --shadow: 0 24px 60px rgb(3 16 34 / 24%);
      --ease: cubic-bezier(.22,.61,.36,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 95%; background: transparent; }
    body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink); }
    button { font: inherit; }

    .notice-board {
      width: 100%; overflow: hidden; position: relative; color: var(--white);
      background: linear-gradient(135deg, rgb(18 48 83 / 95%), rgb(43 89 132 / 93%));
      box-shadow: 0 28px 80px rgb(3 16 34 / 35%), inset 0 1px 0 rgb(255 255 255 / 25%);
      isolation: isolate;
    }
    .notice-board::after { content: ""; position: absolute; z-index: -1; width: 30rem; height: 30rem; right: -12rem; bottom: 18%; border-radius: 50%; background: rgb(198 161 91 / 14%); filter: blur(80px); pointer-events: none; }
    .notice-board::before {
      content: ""; position: absolute; z-index: -1; inset: 0 0 auto; height: 44%;
      background: radial-gradient(circle at 85% 10%, rgb(198 161 91 / 24%), transparent 34%),
                  linear-gradient(115deg, #12335a 0%, #2c6090 100%);
    }
    .notice-head { position: relative; z-index: 2; display: flex; align-items: end; justify-content: space-between; gap: 0.8rem; padding: clamp(1rem, 3vw, 2rem) clamp(1.05rem, 5vw, 4.5rem) 1rem; }
    .eyebrow { display: flex; align-items: center; gap: .65rem; margin: 0 0 .5rem; color: var(--gold-light); font-size: .74rem; font-weight: 700; letter-spacing: .22em; }
    .eyebrow::before { content: ""; width: 2.15rem; height: 1px; background: var(--gold); }
    h1 { margin: 0; font-size: clamp(1.2rem, 3.6vw, 2.4rem); font-weight: 800; letter-spacing: .1em; line-height: 1.05; }
    .viewport { width: 100%; overflow: hidden; background: #f2f4f7; }
    .track { display: flex; transition: transform .7s var(--ease); will-change: transform; }
    .slide { flex: 0 0 100%; width: 100%; margin: 0; position: relative; background: #f2f4f7; }
    .slide-link { display: block; position: relative; color: inherit; text-decoration: none; }
    .slide-image { display: block; width: 100%; aspect-ratio: 5 / 2; height: auto; object-fit: contain; object-position: center; background: #e7ebf0; }
    .slide-image.error { object-fit: contain; padding: 3rem; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(3 16 34 / 38%) 0%, rgb(3 16 34 / 12%) 47%, transparent 78%), linear-gradient(0deg, rgb(3 16 34 / 22%), transparent 42%); pointer-events: none; }
    .slide-info { position: absolute; z-index: 1; left: clamp(1.25rem, 6vw, 5.5rem); bottom: clamp(1.5rem, 4vw, 3.5rem); max-width: min(56rem, 75%); text-shadow: 0 2px 14px rgb(0 0 0 / 25%); }
    .tag { display: inline-flex; align-items: center; margin-bottom: .75rem; padding: .38rem .72rem; border: 1px solid rgb(234 214 164 / 68%); border-radius: 2px; color: #fff; background: rgb(9 27 53 / 62%); font-size: .75rem; font-weight: 700; letter-spacing: .14em; backdrop-filter: blur(6px); }
    .slide-title { margin: 0; font-size: clamp(1.3rem, 4vw, 3rem); font-weight: 800; letter-spacing: .08em; line-height: 1.3; }
    .slide-date { margin: .7rem 0 0; color: #f7e8bd; font-size: .82rem; letter-spacing: .12em; }
    .slide-summary { margin: .85rem 0 0; max-width: 42rem; color: rgb(255 255 255 / 88%); font-size: clamp(.82rem, 1.5vw, 1rem); line-height: 1.8; letter-spacing: .04em; text-shadow: 0 1px 8px rgb(0 0 0 / 35%); }
    .detail-button { display: inline-flex; align-items: center; gap: .65rem; margin-top: 1.1rem; padding: .62rem 1.05rem; border: 1px solid var(--gold-light); border-radius: 2px; color: var(--navy); background: var(--gold-light); font-size: .84rem; font-weight: 800; letter-spacing: .1em; text-decoration: none; text-shadow: none; transition: .2s ease; }
    .detail-button::after { content: '→'; font-size: 1.1rem; transition: transform .2s ease; }
    .detail-button:hover, .detail-button:focus-visible { color: var(--navy); background: #fff3cf; outline: none; box-shadow: 0 5px 18px rgb(0 0 0 / 22%); }
    .detail-button:hover::after, .detail-button:focus-visible::after { transform: translateX(4px); }
    .controls { position: absolute; z-index: 3; inset: 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
    .viewport { position: relative; }
    .arrow { pointer-events: auto; display: grid; place-items: center; width: 3rem; height: 3rem; margin: 0 1rem; border: 1px solid rgb(255 255 255 / 55%); border-radius: 50%; color: #fff; background: rgb(9 27 53 / 56%); cursor: pointer; font-size: 1.7rem; line-height: 1; backdrop-filter: blur(8px); transition: .2s ease; }
    .arrow:hover, .arrow:focus-visible { border-color: var(--gold-light); color: var(--gold-light); background: var(--navy); outline: none; transform: scale(1.06); }
    .board-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem clamp(1.2rem, 5vw, 4.5rem); background: #07172e; border-top: 1px solid var(--line); }
    .counter { color: var(--gold-light); font-size: .78rem; font-variant-numeric: tabular-nums; letter-spacing: .14em; white-space: nowrap; }
    .progress { flex: 1; height: 2px; overflow: hidden; background: rgb(255 255 255 / 17%); }
    .progress-bar { display: block; width: 0; height: 100%; background: var(--gold); transition: width .7s var(--ease); }
    .dots { display: flex; align-items: center; gap: .45rem; }
    .dot { width: 1.8rem; height: 1.5rem; padding: 0; border: 0; border-bottom: 2px solid rgb(255 255 255 / 28%); background: transparent; cursor: pointer; }
    .dot::after { content: ""; display: block; width: .35rem; height: .35rem; margin: auto; border-radius: 50%; background: rgb(255 255 255 / 55%); transition: .2s ease; }
    .dot.active { border-color: var(--gold); }
    .dot.active::after { background: var(--gold-light); transform: scale(1.25); }
    .pause { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--gold-light); background: transparent; cursor: pointer; font-size: .7rem; }
    .pause:hover, .pause:focus-visible { border-color: var(--gold); outline: none; }
    .message { padding: 3rem 1.5rem; color: var(--muted); background: #f2f4f7; text-align: center; }
    .latest-count { color: #6a7a8d; font-size: .78rem; }
    .latest { position: relative; padding: clamp(1.5rem, 4vw, 3rem) clamp(1.2rem, 5vw, 4.5rem) 2.5rem; color: var(--ink); background: linear-gradient(135deg, #f5f8fc, #eef2f7); }
    .latest::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 10% 0%, rgb(255 255 255 / 90%), transparent 30%); }
    .latest-head, .latest-filter, .latest-grid, .latest-pages { position: relative; z-index: 1; }
    .latest-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
    .latest-kicker { margin: 0 0 .4rem; color: var(--gold); font-size: .72rem; font-weight: 800; letter-spacing: .2em; }
    .latest-title { margin: 0; color: var(--navy); font-size: clamp(1.3rem, 2.7vw, 2rem); letter-spacing: .12em; }
    .latest-rule { width: 4rem; height: 2px; margin-top: .7rem; background: var(--gold); }
    .latest-tools { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; margin: 0 0 1rem; }
    .search-box { flex: 1 1 240px; min-width: 0; padding: .72rem .9rem; border: 1px solid rgb(112 132 155 / 28%); border-radius: 10px; color: var(--ink); background: rgb(255 255 255 / 64%); box-shadow: inset 0 1px 0 rgb(255 255 255 / 80%), 0 8px 20px rgb(35 61 91 / 6%); outline: none; backdrop-filter: blur(14px); }
    .search-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgb(198 161 91 / 18%); }
    .sort-select { padding: .72rem .85rem; border: 1px solid rgb(112 132 155 / 28%); border-radius: 10px; color: var(--ink); background: rgb(255 255 255 / 64%); outline: none; backdrop-filter: blur(14px); }
    .latest-filter { display: flex; flex-wrap: wrap; gap: .55rem; margin: 0 0 1.25rem; }
    .filter-button { padding: .52rem .85rem; border: 1px solid rgb(112 132 155 / 30%); border-radius: 999px; color: #52657b; background: rgb(255 255 255 / 48%); box-shadow: inset 0 1px 0 rgb(255 255 255 / 80%); cursor: pointer; font-size: .8rem; font-weight: 700; letter-spacing: .04em; backdrop-filter: blur(12px); transition: .2s ease; }
    .filter-button:hover, .filter-button.active { border-color: var(--navy); color: #fff; background: linear-gradient(135deg, var(--navy), #244b77); box-shadow: 0 8px 18px rgb(9 27 53 / 18%); }
    .latest-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; }
    .latest-empty { grid-column: 1 / -1; padding: 2.5rem 1rem; border: 1px dashed #cbd5e1; border-radius: 16px; color: #6c7b8e; text-align: center; background: rgb(255 255 255 / 48%); }
    .latest-card { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid rgb(255 255 255 / 80%); border-radius: 16px; color: inherit; text-decoration: none; background: rgb(255 255 255 / 54%); box-shadow: 0 14px 30px rgb(35 61 91 / 10%), inset 0 1px 0 rgb(255 255 255 / 88%); backdrop-filter: blur(18px) saturate(125%); transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease; }
    .latest-card { cursor: pointer; }
    .latest-card:focus-within { border-color: rgb(198 161 91 / 62%); }
    .latest-card:hover { transform: translateY(-7px); border-color: rgb(198 161 91 / 62%); box-shadow: 0 22px 42px rgb(35 61 91 / 18%), 0 0 0 1px rgb(198 161 91 / 12%); }
    .latest-thumb { display: block; width: 100%; aspect-ratio: 5 / 2; object-fit: contain; object-position: center; background: linear-gradient(135deg, #dfe7f0, #f8fafc); }
    .latest-content { display: flex; flex: 1; flex-direction: column; padding: 1rem 1.1rem 1.15rem; }
    .latest-meta { display: flex; justify-content: space-between; gap: .7rem; color: #9a7a3d; font-size: .7rem; font-weight: 800; letter-spacing: .08em; }
    .latest-card-title { margin: .55rem 0 .4rem; color: var(--navy); font-size: 1.05rem; line-height: 1.45; }
    .latest-summary { display: -webkit-box; overflow: hidden; margin: 0; color: #617083; font-size: .84rem; line-height: 1.7; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .latest-link { align-self: flex-start; margin-top: auto; padding-top: .85rem; color: #9a7a3d; font-size: .82rem; font-weight: 800; text-decoration: none; letter-spacing: .05em; }
    .latest-link:hover { color: var(--navy); }
    .latest-pages { display: flex; justify-content: center; align-items: center; gap: .45rem; margin-top: 1.45rem; }
    .page-button { min-width: 2rem; height: 2rem; padding: 0 .55rem; border: 1px solid #d9e0e8; color: var(--navy); background: #fff; cursor: pointer; font-size: .8rem; }
    .page-button:hover, .page-button.active { border-color: var(--navy); color: #fff; background: var(--navy); }
    .page-button:disabled { cursor: not-allowed; opacity: .4; }
    @media (max-width: 850px) { .latest-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .latest { padding: 1.6rem 1rem 2rem; } .latest-head { align-items: start; flex-direction: column; } .latest-grid { grid-template-columns: 1fr; gap: .85rem; } }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .slide-image { aspect-ratio: 5 / 2; height: auto; }
      .slide-info { max-width: 84%; bottom: 2rem; }
      .slide-title { letter-spacing: .04em; }
      .arrow { width: 2.5rem; height: 2.5rem; margin: .65rem; }
      .board-foot { flex-wrap: wrap; padding-top: .7rem; padding-bottom: .7rem; }
      .progress { order: 3; flex-basis: 100%; }
      .dots { margin-left: auto; }
    }
    @media (prefers-reduced-motion: reduce) { .track, .progress-bar { transition: none; } }
  </style>
</head>
<body>
  <main class="notice-board" aria-label="最新公告">
    <header class="notice-head">
      <div><p class="eyebrow">OFFICIAL ANNOUNCEMENT</p><h1>最新公告</h1></div>
    </header>
    <div id="message" class="message">正在載入公告…</div>
    <div class="viewport" hidden><div id="track" class="track"></div><div class="controls"><button id="prev" class="arrow" type="button" aria-label="上一則公告">‹</button><button id="next" class="arrow" type="button" aria-label="下一則公告">›</button></div></div>
    <footer class="board-foot" hidden>
      <span id="counter" class="counter" aria-live="polite">01 / 01</span><span class="progress"><span id="progressBar" class="progress-bar"></span></span><div id="dots" class="dots" aria-label="公告選擇"></div><button id="pause" class="pause" type="button" aria-label="暫停輪播">Ⅱ</button>
    </footer>
    <section class="latest" aria-labelledby="latest-title">
      <div class="latest-head"><div><h2 id="latest-title" class="latest-title">最新公告列表</h2><div class="latest-rule"></div></div></div><div class="latest-tools"><label class="search-box"><span class="sr-only">搜尋公告</span><input id="searchInput" type="search" placeholder="搜尋標題、摘要或分類…" style="width:100%;border:0;outline:0;background:transparent;color:inherit;font:inherit;"></label><select id="sortSelect" class="sort-select" aria-label="公告日期排序"><option value="newest">日期：最新優先</option><option value="oldest">日期：最早優先</option></select><span id="latestCount" class="latest-count"></span></div><div id="latestFilter" class="latest-filter" aria-label="公告分類篩選"></div>
      <div id="latestGrid" class="latest-grid"></div>
      <nav id="latestPages" class="latest-pages" aria-label="最新公告分頁"></nav>
    </section>
  </main>
  <script>
    (() => {
      'use strict';

      const $ = (selector, scope = document) => scope.querySelector(selector);
      const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];
      const els = {
        track: $('#track'), dots: $('#dots'), message: $('#message'), viewport: $('.viewport'),
        footer: $('.board-foot'), counter: $('#counter'), progress: $('#progressBar'), pause: $('#pause'),
        latestGrid: $('#latestGrid'), latestPages: $('#latestPages'), latestFilter: $('#latestFilter'),
        latestCount: $('#latestCount'), latestTitle: $('#latest-title'), search: $('#searchInput'), sort: $('#sortSelect'),
        prev: $('#prev'), next: $('#next')
      };
      const state = { items: [], current: 0, timer: null, paused: false, page: 1, filter: '全部', query: '', sort: 'newest' };
      const PAGE_SIZE = 6;
      const ROTATE_MS = 6000;

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
      }

      function parseDate(value, endOfDay = false) {
        if (!value) return null;
        const raw = String(value).trim().replaceAll('.', '-');
        const normalized = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? raw + (endOfDay ? 'T23:59:59' : 'T00:00:00') : raw;
        const date = new Date(normalized);
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function isActive(item) {
        const end = parseDate(item.expiresAt, true);
        const now = new Date();
        return !end || end >= now;
      }

      function safeUrl(value, fallback = '#') {
        const raw = String(value ?? '').trim();
        if (!raw) return fallback;
        if (/^(javascript|vbscript|data):/i.test(raw)) return fallback;
        try {
          const url = new URL(raw, document.baseURI);
          if (!['http:', 'https:'].includes(url.protocol)) return fallback;
          return url.href;
        } catch { return fallback; }
      }

      function imageUrl(value) {
        const raw = String(value ?? '').trim();
        if (!raw) return '';
        if (/^(https?:|data:|blob:)/i.test(raw)) return raw;
        const clean = raw.replace(/^\/+/, '');
        const path = clean.startsWith('data/') ? clean : (clean.startsWith('images/') ? `data/${clean}` : `data/images/${clean}`);
        return new URL(path, document.baseURI).href;
      }

      function detailUrl(item, index) {
        return safeUrl(item.detailUrl || `detail.html?id=${encodeURIComponent(item.id ?? index)}`, '#');
      }

      function actionUrl(item, index) {
        if (item.linkType === 'external' && item.link) return safeUrl(item.link, detailUrl(item, index));
        return detailUrl(item, index);
      }

      function targetFor(item) { return item.linkType === 'external' ? '_blank' : '_top'; }

      async function loadData() {
        const response = await fetch('data/announcements.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('找不到 data/announcements.json');
        const payload = await response.json();
        const source = Array.isArray(payload) ? payload : payload.announcements;
        if (!Array.isArray(source)) throw new Error('公告資料格式錯誤');
        return source.map((item, index) => ({ ...item, _index: index, image: imageUrl(item.image) }))
          .filter(item => item.title && item.image && isActive(item))
          .sort((a, b) => Number(Boolean(b.pinned)) - Number(Boolean(a.pinned)));
      }

      function renderHero() {
        const { items } = state;
        if (!items.length) {
          els.message.hidden = false;
          els.message.textContent = '目前沒有可顯示的公告。';
          els.viewport.hidden = true;
          els.footer.hidden = true;
          return;
        }
        els.message.hidden = true;
        els.viewport.hidden = false;
        els.footer.hidden = false;
        els.track.innerHTML = items.map((item, index) => {
          const url = escapeHtml(actionUrl(item, item._index));
          const target = targetFor(item);
          return `<figure class="slide">
            <a class="slide-link" href="${url}" target="${target}" rel="noopener noreferrer">
              <img class="slide-image" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="${index ? 'lazy' : 'eager'}" decoding="async">
            </a>
            <div class="shade" aria-hidden="true"></div>
            <div class="slide-info">
              <span class="tag">${escapeHtml(item.tag || '公告')}</span>
              <h2 class="slide-title">${escapeHtml(item.title)}</h2>
              ${item.summary ? `<p class="slide-summary">${escapeHtml(item.summary)}</p>` : ''}
              ${item.date ? `<p class="slide-date">公告期間｜${escapeHtml(item.date)}${item.expiresAt ? `－${escapeHtml(item.expiresAt)}` : ''}</p>` : ''}
              <a class="detail-button" href="${url}" target="${target}" rel="noopener noreferrer">${escapeHtml(item.buttonText || '了解更多')}</a>
            </div>
          </figure>`;
        }).join('');
        $$('.slide-image', els.track).forEach(img => img.addEventListener('error', () => {
          img.classList.add('error');
          img.alt = '圖片載入失敗，請確認圖片檔名與路徑';
        }, { once: true }));
        els.dots.innerHTML = items.map((item, index) => `<button class="dot" type="button" aria-label="第 ${index + 1} 則公告：${escapeHtml(item.title)}" data-index="${index}"></button>`).join('');
        $$('.dot', els.dots).forEach(button => button.addEventListener('click', () => goTo(Number(button.dataset.index))));
        updateHero();
        startTimer();
      }

      function filteredItems() {
        const query = state.query.trim().toLocaleLowerCase();
        return state.items.filter(item => {
          const category = item.tag || '未分類';
          const haystack = [item.title, item.summary, item.tag, item.date].join(' ').toLocaleLowerCase();
          return (state.filter === '全部' || category === state.filter) && (!query || haystack.includes(query));
        }).sort((a, b) => {
          const da = parseDate(a.date)?.getTime() || 0;
          const db = parseDate(b.date)?.getTime() || 0;
          return state.sort === 'newest' ? db - da : da - db;
        });
      }

      function renderFilters() {
        const categories = ['全部', ...new Set(state.items.map(item => item.tag || '未分類'))];
        els.latestFilter.innerHTML = categories.map(category => `<button class="filter-button ${category === state.filter ? 'active' : ''}" type="button" data-filter="${escapeHtml(category)}" aria-pressed="${category === state.filter}">${escapeHtml(category)}</button>`).join('');
        $$('[data-filter]', els.latestFilter).forEach(button => button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          state.page = 1;
          renderFilters();
          renderLatest();
        }));
      }

      function renderLatest() {
        const items = filteredItems();
        const pages = Math.ceil(items.length / PAGE_SIZE);
        state.page = Math.min(state.page, Math.max(pages, 1));
        const start = (state.page - 1) * PAGE_SIZE;
        els.latestCount.textContent = `共 ${items.length} 則`;
        els.latestGrid.innerHTML = items.length ? items.slice(start, start + PAGE_SIZE).map(item => {
          const url = escapeHtml(actionUrl(item, item._index));
          const target = targetFor(item);
          return `<a class="latest-card" href="${url}" target="${target}" rel="noopener noreferrer" aria-label="${escapeHtml(item.buttonText || '了解更多')}：${escapeHtml(item.title)}">
            <img class="latest-thumb" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async">
            <span class="latest-content"><span class="latest-meta"><span>${item.pinned ? '置頂｜' : ''}${escapeHtml(item.tag || '公告')}</span><span>${escapeHtml(item.date || '')}</span></span><span class="latest-card-title">${escapeHtml(item.title)}</span><span class="latest-summary">${escapeHtml(item.summary || '點選查看公告詳細內容。')}</span><span class="latest-link">${escapeHtml(item.buttonText || '了解更多')} →</span></span>
          </a>`;
        }).join('') : '<div class="latest-empty">找不到符合條件的公告。</div>';
        els.latestPages.innerHTML = pages > 1 ? `<button class="page-button" type="button" ${state.page === 1 ? 'disabled' : ''} data-page="${state.page - 1}">上一頁</button>${Array.from({ length: pages }, (_, index) => `<button class="page-button ${index + 1 === state.page ? 'active' : ''}" type="button" aria-current="${index + 1 === state.page ? 'page' : 'false'}" data-page="${index + 1}">${index + 1}</button>`).join('')}<button class="page-button" type="button" ${state.page === pages ? 'disabled' : ''} data-page="${state.page + 1}">下一頁</button>` : '';
        $$('[data-page]', els.latestPages).forEach(button => button.addEventListener('click', () => {
          if (button.disabled) return;
          state.page = Number(button.dataset.page);
          renderLatest();
          els.latestTitle.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }));
      }

      function updateHero() {
        if (!state.items.length) return;
        els.track.style.transform = `translate3d(-${state.current * 100}%, 0, 0)`;
        els.counter.textContent = `${String(state.current + 1).padStart(2, '0')} / ${String(state.items.length).padStart(2, '0')}`;
        els.progress.style.width = `${((state.current + 1) / state.items.length) * 100}%`;
        $$('.dot', els.dots).forEach((dot, index) => {
          const active = index === state.current;
          dot.classList.toggle('active', active);
          dot.setAttribute('aria-current', active ? 'true' : 'false');
        });
      }

      function stopTimer() { clearInterval(state.timer); state.timer = null; }
      function startTimer() { stopTimer(); if (!state.paused && state.items.length > 1) state.timer = setInterval(() => goTo(state.current + 1, false), ROTATE_MS); }
      function goTo(index, restart = true) {
        if (!state.items.length) return;
        state.current = (index + state.items.length) % state.items.length;
        updateHero();
        if (restart) startTimer();
      }
      function togglePause() {
        state.paused = !state.paused;
        els.pause.textContent = state.paused ? '▶' : 'Ⅱ';
        els.pause.setAttribute('aria-label', state.paused ? '繼續輪播' : '暫停輪播');
        els.pause.setAttribute('aria-pressed', String(state.paused));
        state.paused ? stopTimer() : startTimer();
      }

      els.search.addEventListener('input', event => { state.query = event.target.value; state.page = 1; renderLatest(); });
      els.sort.addEventListener('change', event => { state.sort = event.target.value; state.page = 1; renderLatest(); });
      els.prev.addEventListener('click', () => goTo(state.current - 1));
      els.next.addEventListener('click', () => goTo(state.current + 1));
      els.pause.addEventListener('click', togglePause);
      let touchStartX = null;
      els.viewport.addEventListener('pointerdown', event => { touchStartX = event.clientX; stopTimer(); }, { passive: true });
      els.viewport.addEventListener('pointerup', event => {
        if (touchStartX !== null) {
          const delta = event.clientX - touchStartX;
          if (Math.abs(delta) > 45) goTo(state.current + (delta < 0 ? 1 : -1));
          else if (!state.paused) startTimer();
        }
        touchStartX = null;
      }, { passive: true });
      els.viewport.addEventListener('pointercancel', () => { touchStartX = null; if (!state.paused) startTimer(); }, { passive: true });
      els.viewport.addEventListener('mouseenter', () => { if (!state.paused) stopTimer(); });
      els.viewport.addEventListener('mouseleave', () => { if (!state.paused) startTimer(); });
      document.addEventListener('keydown', event => {
        const tag = document.activeElement?.tagName;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
        if (event.key === 'ArrowLeft') goTo(state.current - 1);
        if (event.key === 'ArrowRight') goTo(state.current + 1);
        if (event.key === ' ' || event.key.toLowerCase() === 'p') { event.preventDefault(); togglePause(); }
      });

      loadData().then(items => { state.items = items; renderHero(); renderFilters(); renderLatest(); })
        .catch(error => { els.message.hidden = false; els.message.textContent = `公告載入失敗：${error.message}`; console.error(error); });
    })();
  </script>
</body>
</html>
