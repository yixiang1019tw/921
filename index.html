<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f3a">
  <title>最新公告｜機關訊息</title>
  <style>
    :root {
      --navy: #091b35;
      --navy-2: #102c4f;
      --ink: #132238;
      --muted: #6c7b8e;
      --gold: #c6a15b;
      --gold-light: #ead6a4;
      --white: #fff;
      --line: rgb(255 255 255 / 18%);
      --shadow: 0 24px 60px rgb(3 16 34 / 24%);
      --ease: cubic-bezier(.22,.61,.36,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: transparent; }
    body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--ink); }
    button { font: inherit; }

    .notice-board {
      width: 100%; overflow: hidden; position: relative; color: var(--white);
      background: linear-gradient(135deg, rgb(9 27 53 / 97%), rgb(18 51 90 / 96%));
      box-shadow: 0 28px 80px rgb(3 16 34 / 28%), inset 0 1px 0 rgb(255 255 255 / 18%);
      isolation: isolate;
    }
    .notice-board::after { content: ""; position: absolute; z-index: -1; width: 30rem; height: 30rem; right: -12rem; bottom: 18%; border-radius: 50%; background: rgb(198 161 91 / 14%); filter: blur(80px); pointer-events: none; }
    .notice-board::before {
      content: ""; position: absolute; z-index: -1; inset: 0 0 auto; height: 44%;
      background: radial-gradient(circle at 85% 10%, rgb(198 161 91 / 24%), transparent 34%),
                  linear-gradient(115deg, #07172e 0%, #12335a 100%);
    }
    .notice-head { position: relative; z-index: 2; display: flex; align-items: end; justify-content: space-between; gap: 1rem; padding: clamp(1.15rem, 3vw, 1.25rem) clamp(1.2rem, 5vw, 4.5rem) 1.1rem; }
    .eyebrow { display: flex; align-items: center; gap: .65rem; margin: 0 0 .5rem; color: var(--gold-light); font-size: .74rem; font-weight: 700; letter-spacing: .22em; }
    .eyebrow::before { content: ""; width: 2.15rem; height: 1px; background: var(--gold); }
    h1 { margin: 0; font-size: clamp(1.55rem, 3.8vw, 2.65rem); font-weight: 800; letter-spacing: .1em; line-height: 1.15; }
    .head-mark { flex: 0 0 auto; display: flex; align-items: center; gap: .55rem; color: var(--gold-light); font-size: .75rem; letter-spacing: .12em; white-space: nowrap; }
    .seal { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border: 1px solid var(--gold); border-radius: 50%; color: var(--gold-light); font-size: .66rem; line-height: 1.15; text-align: center; }
    .viewport { width: 100%; overflow: hidden; background: #f2f4f7; }
    .track { display: flex; transition: transform .7s var(--ease); will-change: transform; }
    .slide { flex: 0 0 100%; width: 100%; margin: 0; position: relative; background: #f2f4f7; }
    .slide-link { display: block; position: relative; color: inherit; text-decoration: none; }
    .slide-image { display: block; width: 100%; aspect-ratio: 5 / 2; height: auto; object-fit: contain; object-position: center; background: #e7ebf0; }
    .slide-image.error { object-fit: contain; padding: 3rem; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(3 16 34 / 74%) 0%, rgb(3 16 34 / 28%) 47%, transparent 78%), linear-gradient(0deg, rgb(3 16 34 / 48%), transparent 42%); pointer-events: none; }
    .slide-info { position: absolute; z-index: 1; left: clamp(1.25rem, 6vw, 5.5rem); bottom: clamp(1.5rem, 4vw, 3.5rem); max-width: min(56rem, 75%); text-shadow: 0 2px 14px rgb(0 0 0 / 25%); }
    .tag { display: inline-flex; align-items: center; margin-bottom: .75rem; padding: .38rem .72rem; border: 1px solid rgb(234 214 164 / 68%); border-radius: 2px; color: #fff; background: rgb(9 27 53 / 62%); font-size: .75rem; font-weight: 700; letter-spacing: .14em; backdrop-filter: blur(6px); }
    .slide-title { margin: 0; font-size: clamp(1.3rem, 4vw, 3rem); font-weight: 800; letter-spacing: .08em; line-height: 1.3; }
    .slide-date { margin: .7rem 0 0; color: #f7e8bd; font-size: .82rem; letter-spacing: .12em; }
    .slide-summary { margin: .85rem 0 0; max-width: 42rem; color: rgb(255 255 255 / 88%); font-size: clamp(.82rem, 1.5vw, 1rem); line-height: 1.8; letter-spacing: .04em; text-shadow: 0 1px 8px rgb(0 0 0 / 35%); }
    .detail-button { display: inline-flex; align-items: center; gap: .65rem; margin-top: 1.1rem; padding: .62rem 1.05rem; border: 1px solid var(--gold-light); border-radius: 2px; color: var(--navy); background: var(--gold-light); font-size: .84rem; font-weight: 800; letter-spacing: .1em; text-shadow: none; transition: .2s ease; }
    .detail-button::after { content: '→'; font-size: 1.1rem; transition: transform .2s ease; }
    .detail-button:hover, .detail-button:focus-visible { color: var(--navy); background: #fff3cf; outline: none; box-shadow: 0 5px 18px rgb(0 0 0 / 22%); }
    .detail-button:hover::after, .detail-button:focus-visible::after { transform: translateX(4px); }
    .controls { position: absolute; z-index: 3; inset: 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
    .viewport { position: relative; }
    .arrow { pointer-events: auto; display: grid; place-items: center; width: 3rem; height: 3rem; margin: 0 1rem; border: 1px solid rgb(255 255 255 / 55%); border-radius: 50%; color: #fff; background: rgb(9 27 53 / 56%); cursor: pointer; font-size: 1.7rem; line-height: 1; backdrop-filter: blur(8px); transition: .2s ease; }
    .arrow:hover, .arrow:focus-visible { border-color: var(--gold-light); color: var(--gold-light); background: var(--navy); outline: none; transform: scale(1.06); }
    .board-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem clamp(1.2rem, 5vw, 4.5rem); background: #07172e; border-top: 1px solid var(--line); }
    .counter { color: var(--gold-light); font-size: .78rem; font-variant-numeric: tabular-nums; letter-spacing: .14em; white-space: nowrap; }
    .progress { flex: 1; height: 2px; overflow: hidden; background: rgb(255 255 255 / 17%); }
    .progress-bar { display: block; width: 0; height: 100%; background: var(--gold); transition: width .7s var(--ease); }
    .dots { display: flex; align-items: center; gap: .45rem; }
    .dot { width: 1.8rem; height: 1.5rem; padding: 0; border: 0; border-bottom: 2px solid rgb(255 255 255 / 28%); background: transparent; cursor: pointer; }
    .dot::after { content: ""; display: block; width: .35rem; height: .35rem; margin: auto; border-radius: 50%; background: rgb(255 255 255 / 55%); transition: .2s ease; }
    .dot.active { border-color: var(--gold); }
    .dot.active::after { background: var(--gold-light); transform: scale(1.25); }
    .pause { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; padding: 0; border: 1px solid var(--line); border-radius: 50%; color: var(--gold-light); background: transparent; cursor: pointer; font-size: .7rem; }
    .pause:hover, .pause:focus-visible { border-color: var(--gold); outline: none; }
    .message { padding: 3rem 1.5rem; color: var(--muted); background: #f2f4f7; text-align: center; }
    .latest-count { color: #6a7a8d; font-size: .78rem; }
    .latest { position: relative; padding: clamp(1.5rem, 4vw, 3rem) clamp(1.2rem, 5vw, 4.5rem) 2.5rem; color: var(--ink); background: linear-gradient(135deg, #f5f8fc, #eef2f7); }
    .latest::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 10% 0%, rgb(255 255 255 / 90%), transparent 30%); }
    .latest-head, .latest-filter, .latest-grid, .latest-pages { position: relative; z-index: 1; }
    .latest-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
    .latest-kicker { margin: 0 0 .4rem; color: var(--gold); font-size: .72rem; font-weight: 800; letter-spacing: .2em; }
    .latest-title { margin: 0; color: var(--navy); font-size: clamp(1.3rem, 2.7vw, 2rem); letter-spacing: .12em; }
    .latest-rule { width: 4rem; height: 2px; margin-top: .7rem; background: var(--gold); }
    .latest-tools { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; margin: 0 0 1rem; }
    .search-box { flex: 1 1 240px; min-width: 0; padding: .72rem .9rem; border: 1px solid rgb(112 132 155 / 28%); border-radius: 10px; color: var(--ink); background: rgb(255 255 255 / 64%); box-shadow: inset 0 1px 0 rgb(255 255 255 / 80%), 0 8px 20px rgb(35 61 91 / 6%); outline: none; backdrop-filter: blur(14px); }
    .search-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgb(198 161 91 / 18%); }
    .sort-select { padding: .72rem .85rem; border: 1px solid rgb(112 132 155 / 28%); border-radius: 10px; color: var(--ink); background: rgb(255 255 255 / 64%); outline: none; backdrop-filter: blur(14px); }
    .latest-filter { display: flex; flex-wrap: wrap; gap: .55rem; margin: 0 0 1.25rem; }
    .filter-button { padding: .52rem .85rem; border: 1px solid rgb(112 132 155 / 30%); border-radius: 999px; color: #52657b; background: rgb(255 255 255 / 48%); box-shadow: inset 0 1px 0 rgb(255 255 255 / 80%); cursor: pointer; font-size: .8rem; font-weight: 700; letter-spacing: .04em; backdrop-filter: blur(12px); transition: .2s ease; }
    .filter-button:hover, .filter-button.active { border-color: var(--navy); color: #fff; background: linear-gradient(135deg, var(--navy), #244b77); box-shadow: 0 8px 18px rgb(9 27 53 / 18%); }
    .latest-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; }
    .latest-empty { grid-column: 1 / -1; padding: 2.5rem 1rem; border: 1px dashed #cbd5e1; border-radius: 16px; color: #6c7b8e; text-align: center; background: rgb(255 255 255 / 48%); }
    .latest-card { display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid rgb(255 255 255 / 80%); border-radius: 16px; background: rgb(255 255 255 / 54%); box-shadow: 0 14px 30px rgb(35 61 91 / 10%), inset 0 1px 0 rgb(255 255 255 / 88%); backdrop-filter: blur(18px) saturate(125%); transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease; }
    .latest-card { cursor: pointer; }
    .latest-card:focus-within { border-color: rgb(198 161 91 / 62%); }
    .latest-card:hover { transform: translateY(-7px); border-color: rgb(198 161 91 / 62%); box-shadow: 0 22px 42px rgb(35 61 91 / 18%), 0 0 0 1px rgb(198 161 91 / 12%); }
    .latest-thumb { display: block; width: 100%; aspect-ratio: 5 / 2; object-fit: cover; object-position: center; background: linear-gradient(135deg, #dfe7f0, #f8fafc); }
    .latest-content { display: flex; flex: 1; flex-direction: column; padding: 1rem 1.1rem 1.15rem; }
    .latest-meta { display: flex; justify-content: space-between; gap: .7rem; color: #9a7a3d; font-size: .7rem; font-weight: 800; letter-spacing: .08em; }
    .latest-card-title { margin: .55rem 0 .4rem; color: var(--navy); font-size: 1.05rem; line-height: 1.45; }
    .latest-summary { display: -webkit-box; overflow: hidden; margin: 0; color: #617083; font-size: .84rem; line-height: 1.7; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .latest-link { align-self: flex-start; margin-top: auto; padding-top: .85rem; color: #9a7a3d; font-size: .82rem; font-weight: 800; text-decoration: none; letter-spacing: .05em; }
    .latest-link:hover { color: var(--navy); }
    .latest-pages { display: flex; justify-content: center; align-items: center; gap: .45rem; margin-top: 1.45rem; }
    .page-button { min-width: 2rem; height: 2rem; padding: 0 .55rem; border: 1px solid #d9e0e8; color: var(--navy); background: #fff; cursor: pointer; font-size: .8rem; }
    .page-button:hover, .page-button.active { border-color: var(--navy); color: #fff; background: var(--navy); }
    .page-button:disabled { cursor: not-allowed; opacity: .4; }
    @media (max-width: 850px) { .latest-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .latest { padding: 1.6rem 1rem 2rem; } .latest-head { align-items: start; flex-direction: column; } .latest-grid { grid-template-columns: 1fr; gap: .85rem; } }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .head-mark { display: none; }
      .slide-image { aspect-ratio: 5 / 2; height: auto; }
      .slide-info { max-width: 84%; bottom: 2rem; }
      .slide-title { letter-spacing: .04em; }
      .arrow { width: 2.5rem; height: 2.5rem; margin: .65rem; }
      .board-foot { flex-wrap: wrap; padding-top: .7rem; padding-bottom: .7rem; }
      .progress { order: 3; flex-basis: 100%; }
      .dots { margin-left: auto; }
    }
    @media (prefers-reduced-motion: reduce) { .track, .progress-bar { transition: none; } }
  </style>
</head>
<body>
  <main class="notice-board" aria-label="最新公告">
    <header class="notice-head">
      <div><p class="eyebrow">OFFICIAL ANNOUNCEMENT</p><h1>最新公告</h1></div>
      <div class="head-mark"><span class="seal">最新<br>訊息</span><span>NEWS<br>NOTICE</span></div>
    </header>
    <div id="message" class="message">正在載入公告…</div>
    <div class="viewport" hidden><div id="track" class="track"></div><div class="controls"><button id="prev" class="arrow" type="button" aria-label="上一則公告">‹</button><button id="next" class="arrow" type="button" aria-label="下一則公告">›</button></div></div>
    <footer class="board-foot" hidden>
      <span id="counter" class="counter" aria-live="polite">01 / 01</span><span class="progress"><span id="progressBar" class="progress-bar"></span></span><div id="dots" class="dots" aria-label="公告選擇"></div><button id="pause" class="pause" type="button" aria-label="暫停輪播">Ⅱ</button>
    </footer>
    <section class="latest" aria-labelledby="latest-title">
      <div class="latest-head"><div><p class="latest-kicker">LATEST NEWS</p><h2 id="latest-title" class="latest-title">最新公告列表</h2><div class="latest-rule"></div></div></div><div class="latest-tools"><label class="search-box"><span class="sr-only">搜尋公告</span><input id="searchInput" type="search" placeholder="搜尋標題、摘要或分類…" style="width:100%;border:0;outline:0;background:transparent;color:inherit;font:inherit;"></label><select id="sortSelect" class="sort-select" aria-label="公告日期排序"><option value="newest">日期：最新優先</option><option value="oldest">日期：最早優先</option></select><span id="latestCount" class="latest-count"></span></div><div id="latestFilter" class="latest-filter" aria-label="公告分類篩選"></div>
      <div id="latestGrid" class="latest-grid"></div>
      <nav id="latestPages" class="latest-pages" aria-label="最新公告分頁"></nav>
    </section>
  </main>
  <script>
    const track=document.getElementById('track'),dots=document.getElementById('dots'),message=document.getElementById('message'),viewport=document.querySelector('.viewport'),footer=document.querySelector('.board-foot'),counter=document.getElementById('counter'),progressBar=document.getElementById('progressBar'),pause=document.getElementById('pause'),latestGrid=document.getElementById('latestGrid'),latestPages=document.getElementById('latestPages');let announcements=[],current=0,timer=null,paused=false,latestPage=1,latestFilter='全部',searchTerm='',sortOrder='newest';const latestPerPage=6;
    function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function imageUrl(v){let p=String(v||'').trim();if(!p)return '';if(!/^(https?:|data:|blob:)/i.test(p)){p=p.replace(/^\/+/, '');if(!p.startsWith('data/'))p=p.startsWith('images/')?'data/'+p:'data/images/'+p;p=new URL(p,document.baseURI).href}return p}
    function dateValue(v,end=false){if(!v)return null;const t=String(v).replaceAll('.','-');return new Date(/^\d{4}-\d{2}-\d{2}$/.test(t)?t+(end?'T23:59:59':'T00:00:00'):t)}
    function isActive(i){const end=dateValue(i.expiresAt,true);return !end||end>=new Date()}
    function detailUrl(i,n){return i.detailUrl||`detail.html?id=${encodeURIComponent(i.id??n)}`}
    function actionUrl(i,n){return i.linkType==='external'&&i.link?i.link:detailUrl(i,n)}
    function actionTarget(i){return i.linkType==='external'?'_blank':'_top'}
    async function load(){const r=await fetch('data/announcements.json',{cache:'no-store'});if(!r.ok)throw Error('找不到 data/announcements.json');const d=await r.json();return(Array.isArray(d)?d:d.announcements||[]).map((i,n)=>({...i,_index:n,image:imageUrl(i.image)})).filter(i=>i.image&&isActive(i)).sort((a,b)=>Number(Boolean(b.pinned))-Number(Boolean(a.pinned)))}
    function render(){if(!announcements.length){message.textContent='目前沒有公告，請檢查 data/announcements.json';return}message.hidden=true;viewport.hidden=false;footer.hidden=false;track.innerHTML=announcements.map((i,n)=>{const image=`<img class="slide-image" src="${safe(i.image)}" alt="${safe(i.title||'公告圖片')}" loading="${n?'lazy':'eager'}">`;const url=actionUrl(i,i._index),target=actionTarget(i);const link=`<a class="slide-link" href="${safe(url)}" target="${target}" rel="noopener">${image}</a>`;const detail=`<a class="detail-button" href="${safe(url)}" target="${target}" rel="noopener">${safe(i.buttonText||'了解更多')}</a>`;return`<figure class="slide">${link}<div class="shade"></div><div class="slide-info"><span class="tag">${safe(i.tag||'重要公告')}</span><h2 class="slide-title">${safe(i.title||'最新公告')}</h2>${i.summary?`<p class="slide-summary">${safe(i.summary)}</p>`:''}${i.date?`<p class="slide-date">發布日期｜${safe(i.date)}</p>`:''}${detail}</div></figure>`}).join('');track.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.classList.add('error');img.alt='圖片載入失敗，請確認 data 資料夾檔名'}));dots.innerHTML=announcements.map((_,i)=>`<button class="dot" type="button" aria-label="第 ${i+1} 則公告" data-index="${i}"></button>`).join('');dots.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>goTo(+b.dataset.index)));update();renderFilters();renderLatest();start()}
    function filteredAnnouncements(){const q=searchTerm.trim().toLowerCase();return announcements.filter(i=>{const category=i.tag||'未分類';const text=[i.title,i.summary,i.tag,i.date].join(' ').toLowerCase();return (latestFilter==='全部'||category===latestFilter)&&(!q||text.includes(q))}).sort((a,b)=>{const da=dateValue(a.date)?.getTime()||0,db=dateValue(b.date)?.getTime()||0;return sortOrder==='newest'?db-da:da-db})}
    function renderFilters(){const categories=['全部',...new Set(announcements.map(i=>i.tag||'未分類'))];document.getElementById('latestFilter').innerHTML=categories.map(c=>`<button class="filter-button ${c===latestFilter?'active':''}" type="button" data-filter="${safe(c)}">${safe(c)}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{latestFilter=b.dataset.filter;latestPage=1;renderFilters();renderLatest()}))}
    function renderLatest(){const filtered=filteredAnnouncements();document.getElementById('latestCount').textContent=`共 ${filtered.length} 則`;const total=Math.ceil(filtered.length/latestPerPage);if(latestPage>Math.max(total,1))latestPage=1;const start=(latestPage-1)*latestPerPage;latestGrid.innerHTML=filtered.length?filtered.slice(start,start+latestPerPage).map(i=>{const url=actionUrl(i,i._index),target=actionTarget(i);return`<a class="latest-card" href="${safe(url)}" target="${target}" rel="noopener" aria-label="${safe(i.buttonText||'了解更多')}：${safe(i.title||'公告')}"><img class="latest-thumb" src="${safe(i.image)}" alt="${safe(i.title||'公告圖片')}" loading="lazy"><div class="latest-content"><div class="latest-meta"><span>${i.pinned?'置頂｜':''}${safe(i.tag||'公告')}</span><span>${safe(i.date||'')}</span></div><h3 class="latest-card-title">${safe(i.title||'最新公告')}</h3><p class="latest-summary">${safe(i.summary||'點選查看公告詳細內容。')}</p><span class="latest-link">${safe(i.buttonText||'了解更多')} →</span></div></a>`}).join(''):`<div class="latest-empty">找不到符合條件的公告。</div>`;latestPages.innerHTML=total>1?`<button class="page-button" type="button" ${latestPage===1?'disabled':''} data-page="${latestPage-1}">上一頁</button>${Array.from({length:total},(_,i)=>`<button class="page-button ${i+1===latestPage?'active':''}" type="button" data-page="${i+1}">${i+1}</button>`).join('')}<button class="page-button" type="button" ${latestPage===total?'disabled':''} data-page="${latestPage+1}">下一頁</button>`:'';latestPages.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{latestPage=+b.dataset.page;renderLatest();document.getElementById('latest-title').scrollIntoView({behavior:'smooth',block:'start'})}))}
    function update(){track.style.transform=`translateX(-${current*100}%)`;counter.textContent=`${String(current+1).padStart(2,'0')} / ${String(announcements.length).padStart(2,'0')}`;progressBar.style.width=`${((current+1)/announcements.length)*100}%`;dots.querySelectorAll('.dot').forEach((b,i)=>b.classList.toggle('active',i===current))}
    function goTo(i){if(!announcements.length)return;current=(i+announcements.length)%announcements.length;update();start()}
    function start(){clearInterval(timer);if(!paused&&announcements.length>1)timer=setInterval(()=>goTo(current+1),6000)}
    document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value;latestPage=1;renderLatest()});document.getElementById('sortSelect').addEventListener('change',e=>{sortOrder=e.target.value;latestPage=1;renderLatest()});document.getElementById('prev').onclick=()=>goTo(current-1);document.getElementById('next').onclick=()=>goTo(current+1);let touchStartX=0;viewport.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX;clearInterval(timer)},{passive:true});viewport.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>45)goTo(current+(dx<0?1:-1));else if(!paused)start()},{passive:true});pause.onclick=()=>{paused=!paused;pause.textContent=paused?'▶':'Ⅱ';pause.setAttribute('aria-label',paused?'繼續輪播':'暫停輪播');if(paused)clearInterval(timer);else start()};viewport.addEventListener('mouseenter',()=>{if(!paused)clearInterval(timer)});viewport.addEventListener('mouseleave',()=>{if(!paused)start()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')goTo(current-1);if(e.key==='ArrowRight')goTo(current+1);if(e.key===' '){e.preventDefault();pause.click()}});load().then(d=>{announcements=d;render()}).catch(e=>message.textContent='公告載入失敗：'+e.message);
